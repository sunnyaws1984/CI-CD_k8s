apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: html-demo
  template:
    metadata:
      labels:
        app: html-demo
    spec:
      containers:
      - name: web
        image: sunnyaws1984/fastapi-cicd-demo:4
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: html-demo
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: html-demo
  ports:
  - port: 80
    targetPort: 80